name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_NAME: perceptacle
  CLUSTER_NAME: perceptacle-staging
  NAMESPACE: perceptacle-staging

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Login to DigitalOcean Container Registry
        run: |
          doctl registry login

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create registry secret
        run: |
          kubectl create secret docker-registry do-registry \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} \
            --docker-password=${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install perceptacle deploy/helm/perceptacle \
            --namespace ${{ env.NAMESPACE }} \
            --values deploy/helm/perceptacle/values.yaml \
            --values deploy/helm/perceptacle/values-staging.yaml \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }} \
            --set global.imagePullSecrets[0].name=do-registry \
            --set client.image.tag=sha-${{ github.sha }} \
            --set server.image.tag=sha-${{ github.sha }} \
            --set agents.image.tag=sha-${{ github.sha }} \
            --set postgresql.auth.password=${{ secrets.POSTGRES_PASSWORD }} \
            --set server.secrets.sessionSecret=${{ secrets.SESSION_SECRET }} \
            --set server.secrets.openaiApiKey=${{ secrets.OPENAI_API_KEY }} \
            --set server.secrets.anthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }} \
            --set agents.secrets.openaiApiKey=${{ secrets.OPENAI_API_KEY }} \
            --set agents.secrets.anthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }} \
            --wait \
            --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/perceptacle-client -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/perceptacle-server -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/perceptacle-agents -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Get deployment status
        run: |
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    environment: staging
    steps:
      - name: Wait for services to be ready
        run: sleep 30

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Get ingress IP
        id: get-ip
        run: |
          IP=$(kubectl get svc -n ingress-nginx nginx-ingress-ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' || echo "pending")
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Test Client health
        run: |
          kubectl exec -n ${{ env.NAMESPACE }} deploy/perceptacle-client -- wget -qO- http://localhost:80/ || echo "Client check via exec"

      - name: Test Server health
        run: |
          kubectl exec -n ${{ env.NAMESPACE }} deploy/perceptacle-server -- wget -qO- http://localhost:3000/health || echo "Server check via exec"

      - name: Test Agents health
        run: |
          kubectl exec -n ${{ env.NAMESPACE }} deploy/perceptacle-agents -- wget -qO- http://localhost:8000/health || echo "Agents check via exec"

      - name: Smoke test summary
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All health checks passed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Load Balancer IP: \`${{ steps.get-ip.outputs.ip }}\`" >> $GITHUB_STEP_SUMMARY
