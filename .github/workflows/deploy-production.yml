name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g., v1.0.0)'
        required: true
        type: string

env:
  REGISTRY: registry.digitalocean.com
  REGISTRY_NAME: perceptacle
  CLUSTER_NAME: perceptacle-production
  NAMESPACE: perceptacle-production

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Deploying version: $VERSION"

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $VERSION"
            echo "Expected format: v1.0.0"
            exit 1
          fi

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
      url: https://perceptacle.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.14.0'

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Login to DigitalOcean Container Registry
        run: |
          doctl registry login

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create registry secret
        run: |
          kubectl create secret docker-registry do-registry \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} \
            --docker-password=${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }} \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Get current deployment (for rollback)
        id: current
        run: |
          CURRENT_REVISION=$(helm history perceptacle -n ${{ env.NAMESPACE }} --max 1 -o json 2>/dev/null | jq -r '.[0].revision' || echo "0")
          echo "revision=$CURRENT_REVISION" >> $GITHUB_OUTPUT

      - name: Deploy with Helm
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          helm upgrade --install perceptacle deploy/helm/perceptacle \
            --namespace ${{ env.NAMESPACE }} \
            --values deploy/helm/perceptacle/values.yaml \
            --values deploy/helm/perceptacle/values-production.yaml \
            --set global.imageRegistry=${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }} \
            --set global.imagePullSecrets[0].name=do-registry \
            --set client.image.tag=$VERSION \
            --set server.image.tag=$VERSION \
            --set agents.image.tag=$VERSION \
            --set server.secrets.databaseUrl=${{ secrets.PRODUCTION_DATABASE_URL }} \
            --set server.secrets.sessionSecret=${{ secrets.SESSION_SECRET }} \
            --set server.secrets.openaiApiKey=${{ secrets.OPENAI_API_KEY }} \
            --set server.secrets.anthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }} \
            --set server.secrets.githubToken=${{ secrets.GH_TOKEN }} \
            --set server.secrets.azureSubscriptionId=${{ secrets.AZURE_SUBSCRIPTION_ID }} \
            --set server.secrets.azureClientId=${{ secrets.AZURE_CLIENT_ID }} \
            --set server.secrets.azureClientSecret=${{ secrets.AZURE_CLIENT_SECRET }} \
            --set server.secrets.azureTenantId=${{ secrets.AZURE_TENANT_ID }} \
            --set agents.secrets.openaiApiKey=${{ secrets.OPENAI_API_KEY }} \
            --set agents.secrets.anthropicApiKey=${{ secrets.ANTHROPIC_API_KEY }} \
            --wait \
            --timeout 15m

      - name: Verify deployment
        id: verify
        run: |
          kubectl rollout status deployment/perceptacle-client -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/perceptacle-server -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/perceptacle-agents -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Rollback on failure
        if: failure() && steps.current.outputs.revision != '0'
        run: |
          echo "Deployment failed, rolling back to revision ${{ steps.current.outputs.revision }}"
          helm rollback perceptacle ${{ steps.current.outputs.revision }} -n ${{ env.NAMESPACE }}

      - name: Get deployment status
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  smoke-tests:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    environment: production
    steps:
      - name: Wait for services to be ready
        run: sleep 60

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Configure kubectl
        run: |
          doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }}

      - name: Test all services health
        run: |
          # Test via kubectl exec
          kubectl exec -n ${{ env.NAMESPACE }} deploy/perceptacle-client -- wget -qO- http://localhost:80/ > /dev/null
          kubectl exec -n ${{ env.NAMESPACE }} deploy/perceptacle-server -- wget -qO- http://localhost:3000/health
          kubectl exec -n ${{ env.NAMESPACE }} deploy/perceptacle-agents -- wget -qO- http://localhost:8000/health

      - name: Check HPA status
        run: |
          echo "## HPA Status" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          kubectl get hpa -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [validate, deploy, smoke-tests]
    if: always()
    steps:
      - name: Deployment notification
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "Production deployment successful!"
            echo "Version: ${{ needs.validate.outputs.version }}"
          else
            echo "Production deployment failed!"
            exit 1
          fi
