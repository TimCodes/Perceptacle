apiVersion: v1
kind: Secret
metadata:
  name: {{ include "perceptacle.fullname" . }}-agents-secrets
  labels:
    {{- include "perceptacle.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents
type: Opaque
stringData:
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.config.ragServiceApiKey }}
  RAG_SERVICE_API_KEY: {{ .Values.config.ragServiceApiKey | quote }}
  {{- end }}
