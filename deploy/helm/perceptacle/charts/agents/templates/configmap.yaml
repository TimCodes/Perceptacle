apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "perceptacle.fullname" . }}-agents-config
  labels:
    {{- include "perceptacle.labels" . | nindent 4 }}
    app.kubernetes.io/component: agents
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  PORT: "8000"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- if .Values.config.corsOrigins }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  {{- else }}
  CORS_ORIGINS: "https://{{ .Values.global.domain }}"
  {{- end }}
  {{- if .Values.config.ragServiceUrl }}
  RAG_SERVICE_URL: {{ .Values.config.ragServiceUrl | quote }}
  {{- end }}
