{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "perceptacle.fullname" . }}-postgresql
  labels:
    {{- include "perceptacle.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "perceptacle.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
{{- end }}
