{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "perceptacle.fullname" . }}-postgresql-secrets
  labels:
    {{- include "perceptacle.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  password: {{ .Values.auth.password | quote }}
  postgres-password: {{ .Values.auth.postgresPassword | default .Values.auth.password | quote }}
{{- end }}
