# Default values for postgresql subchart
# This is intended for staging/development only
# Production should use DigitalOcean Managed PostgreSQL

image:
  repository: postgres
  tag: "15-alpine"
  pullPolicy: IfNotPresent

auth:
  database: synapse
  username: synapse
  password: ""  # Set via secrets
  postgresPassword: ""  # Set via secrets

persistence:
  enabled: true
  size: 10Gi
  storageClass: do-block-storage
  accessModes:
    - ReadWriteOnce

service:
  type: ClusterIP
  port: 5432

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

securityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999

livenessProbe:
  exec:
    command:
      - pg_isready
      - -U
      - synapse
      - -d
      - synapse
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  exec:
    command:
      - pg_isready
      - -U
      - synapse
      - -d
      - synapse
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
