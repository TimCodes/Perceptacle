apiVersion: v1
kind: Secret
metadata:
  name: {{ include "perceptacle.fullname" . }}-server-secrets
  labels:
    {{- include "perceptacle.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- else if .Values.postgresql.enabled }}
  DATABASE_URL: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "perceptacle.fullname" . }}-postgresql:{{ .Values.postgresql.service.port }}/{{ .Values.postgresql.auth.database }}"
  {{- end }}
  {{- if .Values.secrets.sessionSecret }}
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.geminiApiKey }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.githubToken }}
  GITHUB_TOKEN: {{ .Values.secrets.githubToken | quote }}
  {{- end }}
  {{- if .Values.secrets.azureSubscriptionId }}
  AZURE_SUBSCRIPTION_ID: {{ .Values.secrets.azureSubscriptionId | quote }}
  {{- end }}
  {{- if .Values.secrets.azureClientId }}
  AZURE_CLIENT_ID: {{ .Values.secrets.azureClientId | quote }}
  {{- end }}
  {{- if .Values.secrets.azureClientSecret }}
  AZURE_CLIENT_SECRET: {{ .Values.secrets.azureClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.azureTenantId }}
  AZURE_TENANT_ID: {{ .Values.secrets.azureTenantId | quote }}
  {{- end }}
