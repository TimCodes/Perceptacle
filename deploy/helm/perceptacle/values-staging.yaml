# Staging environment values
# Usage: helm upgrade --install perceptacle . -f values.yaml -f values-staging.yaml

global:
  environment: staging
  domain: staging.perceptacle.example.com

ingress:
  hosts:
    - host: staging.perceptacle.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: server
          port: 3000
        - path: /agents
          pathType: Prefix
          service: agents
          port: 8000
        - path: /
          pathType: Prefix
          service: client
          port: 80
  tls:
    - secretName: perceptacle-staging-tls
      hosts:
        - staging.perceptacle.example.com

# Single replica for staging
client:
  replicaCount: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

server:
  replicaCount: 1
  autoscaling:
    enabled: false
  config:
    nodeEnv: staging
    useMockServices: "false"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

agents:
  replicaCount: 1
  autoscaling:
    enabled: false
  config:
    environment: staging
    logLevel: DEBUG
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi

# Use in-cluster PostgreSQL for staging
postgresql:
  enabled: true
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

externalDatabase:
  enabled: false
