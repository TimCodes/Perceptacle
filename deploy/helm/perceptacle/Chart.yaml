apiVersion: v2
name: perceptacle
description: Perceptacle - A cloud-native telemetry mapping and diagram builder
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: client
    version: 0.1.0
    condition: client.enabled
  - name: server
    version: 0.1.0
    condition: server.enabled
  - name: agents
    version: 0.1.0
    condition: agents.enabled
  - name: postgresql
    version: 0.1.0
    condition: postgresql.enabled

maintainers:
  - name: Perceptacle Team
    email: team@perceptacle.io

keywords:
  - telemetry
  - monitoring
  - kubernetes
  - diagrams
  - cloud-native

home: https://github.com/TimCodes/perceptacle
sources:
  - https://github.com/TimCodes/perceptacle
